version: 2
# Version-update pull requests target dev; security updates remain on the
# repository default branch according to GitHub Dependabot behavior.
updates:
  - package-ecosystem: pip
    directory: "/connectors/otx"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
