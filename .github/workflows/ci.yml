name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            connectors/otx/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip install .

      - name: Validate installable wheel
        run: python scripts/validate_package_wheel.py

      - name: Validate installed runtime package
        run: python scripts/validate_runtime_package.py --compile --imports

      - name: Run tests
        shell: bash
        run: |
          external_cwd="$(mktemp -d)"
          cd "${external_cwd}"
          python -m unittest discover -s "${GITHUB_WORKSPACE}/tests" -v
