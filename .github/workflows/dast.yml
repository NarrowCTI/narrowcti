name: DAST

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-api-dast:
    name: Analyst review API OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build disposable API image
        run: docker build --file Dockerfile.gateway --tag narrowcti-gateway:dast .

      - name: Prepare disposable credentials and state
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/narrowcti-dast"
          mkdir -p "${root}/state/audit" "${root}/reports"
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${token}"
          token_hash="$(TOKEN="${token}" python -c 'import hashlib, os; print(hashlib.sha256(os.environ["TOKEN"].encode()).hexdigest())')"
          TOKEN_HASH="${token_hash}" CREDENTIALS_PATH="${root}/credentials.json" python - <<'PY'
          import json
          import os

          document = {
              "credentials": [
                  {
                      "credential_id": "dast-admin",
                      "principal": "dast-admin",
                      "token_sha256": os.environ["TOKEN_HASH"],
                      "roles": ["admin"],
                  }
              ]
          }
          with open(os.environ["CREDENTIALS_PATH"], "w", encoding="utf-8") as file_obj:
              json.dump(document, file_obj)
          PY
          chmod 0444 "${root}/credentials.json"
          chmod -R 0777 "${root}/state" "${root}/reports"
          echo "NARROWCTI_DAST_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "NARROWCTI_DAST_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Start disposable review API
        shell: bash
        run: |
          set -euo pipefail
          docker network create narrowcti-dast
          docker run --detach \
            --name narrowcti-review-api-dast \
            --network narrowcti-dast \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp \
            --env NARROWCTI_REVIEW_API_HOST=0.0.0.0 \
            --env NARROWCTI_REVIEW_API_PORT=8081 \
            --env NARROWCTI_REVIEW_API_DOCS_ENABLED=true \
            --env NARROWCTI_REVIEW_API_ALLOW_EXPORT=false \
            --env NARROWCTI_REVIEW_API_ALLOWED_HOSTS=narrowcti-review-api-dast,127.0.0.1,localhost \
            --env NARROWCTI_REVIEW_API_CREDENTIALS_FILE=/run/secrets/credentials.json \
            --env NARROWCTI_QUARANTINE_REPOSITORY=/app/state/quarantine.jsonl \
            --env NARROWCTI_RELEASE_AUDIT_FILE=/app/state/audit/releases.jsonl \
            --volume "${NARROWCTI_DAST_ROOT}/state:/app/state" \
            --volume "${NARROWCTI_DAST_ROOT}/credentials.json:/run/secrets/credentials.json:ro" \
            narrowcti-gateway:dast \
            python -m gateway.review_api

      - name: Wait for API and verify authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 30); do
            if docker exec narrowcti-review-api-dast curl --fail --silent http://127.0.0.1:8081/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "${ready}" != "true" ]; then
            docker logs narrowcti-review-api-dast
            exit 1
          fi
          unauthorized="$(docker exec narrowcti-review-api-dast curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/v1/review/summary)"
          test "${unauthorized}" = "401"
          authorized="$(docker exec --env TOKEN="${NARROWCTI_DAST_TOKEN}" narrowcti-review-api-dast sh -c 'curl --silent --output /dev/null --write-out "%{http_code}" --header "Authorization: Bearer ${TOKEN}" http://127.0.0.1:8081/api/v1/review/summary')"
          test "${authorized}" = "200"

      - name: Run OWASP ZAP OpenAPI scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network narrowcti-dast \
            --env ZAP_AUTH_HEADER=Authorization \
            --env ZAP_AUTH_HEADER_VALUE="Bearer ${NARROWCTI_DAST_TOKEN}" \
            --env ZAP_AUTH_HEADER_SITE=narrowcti-review-api-dast \
            --volume "${NARROWCTI_DAST_ROOT}/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-api-scan.py \
            -t http://narrowcti-review-api-dast:8081/openapi.json \
            -f openapi \
            -J narrowcti-review-api-zap.json \
            -r narrowcti-review-api-zap.html \
            -w narrowcti-review-api-zap.md \
            -T 10

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: narrowcti-review-api-dast-${{ github.sha }}
          path: ${{ env.NARROWCTI_DAST_ROOT }}/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up disposable deployment
        if: always()
        shell: bash
        run: |
          docker rm --force narrowcti-review-api-dast >/dev/null 2>&1 || true
          docker network rm narrowcti-dast >/dev/null 2>&1 || true

  community-web-ui-dast:
    name: Community Web UI OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build disposable Web image
        run: docker build --file Dockerfile.gateway --tag narrowcti-web-ui-dast:scan .

      - name: Prepare synthetic credentials, state and reports
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/narrowcti-web-ui-dast"
          mkdir -p "${root}/state/audit" "${root}/reports"
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${token}"
          token_hash="$(TOKEN="${token}" python -c 'import hashlib, os; print(hashlib.sha256(os.environ["TOKEN"].encode()).hexdigest())')"
          TOKEN_HASH="${token_hash}" CREDENTIALS_PATH="${root}/credentials.json" python - <<'PY'
          import json
          import os

          document = {
              "credentials": [
                  {
                      "credential_id": "web-dast-admin",
                      "principal": "web-dast-admin",
                      "token_sha256": os.environ["TOKEN_HASH"],
                      "roles": ["admin"],
                  }
              ]
          }
          with open(os.environ["CREDENTIALS_PATH"], "w", encoding="utf-8") as file_obj:
              json.dump(document, file_obj)
          PY
          chmod 0444 "${root}/credentials.json"
          chmod -R 0777 "${root}/state" "${root}/reports"
          echo "NARROWCTI_WEB_DAST_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "NARROWCTI_WEB_DAST_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Start disposable Community Web role
        shell: bash
        run: |
          set -euo pipefail
          docker network create narrowcti-web-ui-dast
          docker run --detach \
            --name narrowcti-web-ui-dast \
            --network narrowcti-web-ui-dast \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp \
            --env NARROWCTI_REVIEW_API_HOST=0.0.0.0 \
            --env NARROWCTI_REVIEW_API_PORT=8081 \
            --env NARROWCTI_REVIEW_API_CREDENTIALS_FILE=/run/secrets/credentials.json \
            --env NARROWCTI_REVIEW_API_ALLOWED_HOSTS=narrowcti-web-ui-dast,127.0.0.1,localhost \
            --env NARROWCTI_WEB_ALLOWED_HOSTS=narrowcti-web-ui-dast,127.0.0.1,localhost \
            --env NARROWCTI_WEB_COOKIE_SECURE=true \
            --env NARROWCTI_STATE_DIR=/app/state \
            --env NARROWCTI_RUNTIME_DB=/app/state/runtime.db \
            --env NARROWCTI_QUARANTINE_REPOSITORY=/app/state/quarantine.jsonl \
            --env NARROWCTI_RELEASE_AUDIT_FILE=/app/state/audit/releases.jsonl \
            --volume "${NARROWCTI_WEB_DAST_ROOT}/state:/app/state" \
            --volume "${NARROWCTI_WEB_DAST_ROOT}/credentials.json:/run/secrets/credentials.json:ro" \
            --publish 127.0.0.1:18082:8081 \
            narrowcti-web-ui-dast:scan \
            python -m narrowcti.cli.web

      - name: Verify browser login, protected routes and CSRF before scanning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import http.cookiejar
          import os
          from html.parser import HTMLParser
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          class CsrfParser(HTMLParser):
              token = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "input" and values.get("name") == "_csrf":
                      self.token = values.get("value")

          base = "http://127.0.0.1:18082"
          opener = build_opener(NoRedirect())
          ready = False
          for _ in range(30):
              try:
                  with opener.open(base + "/healthz", timeout=2) as response:
                      ready = response.status == 200
                      break
              except Exception:
                  import time
                  time.sleep(1)
          if not ready:
              raise SystemExit("Community Web role did not become healthy")

          response = opener.open(base + "/login", timeout=5)
          body = response.read().decode("utf-8")
          parser = CsrfParser()
          parser.feed(body)
          if response.status != 200 or not parser.token:
              raise SystemExit("login form did not expose the session-bound CSRF token")
          initial_cookie = response.headers.get("Set-Cookie", "").split(";", 1)[0]
          if not initial_cookie:
              raise SystemExit("anonymous session cookie was not issued")

          post = Request(
              base + "/login",
              data=urlencode({"credential": os.environ["NARROWCTI_WEB_DAST_TOKEN"], "_csrf": parser.token}).encode(),
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Origin": base,
                  "Cookie": initial_cookie,
              },
              method="POST",
          )
          try:
              opener.open(post, timeout=5)
          except HTTPError as error:
              if error.code != 303:
                  raise
              authenticated_cookie = error.headers.get("Set-Cookie", "").split(";", 1)[0]
          else:
              raise SystemExit("login did not rotate the session with a redirect")
          if not authenticated_cookie or authenticated_cookie == initial_cookie:
              raise SystemExit("login did not rotate the pre-authentication session")
          cookie_value = authenticated_cookie.split("=", 1)[1]

          def get_authenticated(path):
              request = Request(base + path, headers={"Cookie": authenticated_cookie})
              return opener.open(request, timeout=5)

          for path, marker in (("/explorer", "Source Explorer"), ("/review", "Quarantine review")):
              with get_authenticated(path) as page:
                  if page.status != 200 or marker not in page.read().decode("utf-8"):
                      raise SystemExit(f"authenticated route check failed: {path}")

          logout = Request(
              base + "/logout",
              data=b"",
              headers={"Content-Type": "application/x-www-form-urlencoded", "Cookie": authenticated_cookie},
              method="POST",
          )
          try:
              opener.open(logout, timeout=5)
          except HTTPError as error:
              if error.code != 403:
                  raise
          else:
              raise SystemExit("browser mutation without CSRF was not rejected")

          anonymous = Request(base + "/explorer")
          try:
              opener.open(anonymous, timeout=5)
          except HTTPError as error:
              if error.code != 303:
                  raise
          else:
              raise SystemExit("protected Explorer route was accessible without a session")

          print("authenticated-browser-dast-preflight-ok")
          print(f"::add-mask::{authenticated_cookie}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file_obj:
              file_obj.write(f"NARROWCTI_WEB_DAST_COOKIE={authenticated_cookie}\n")
              file_obj.write(f"NARROWCTI_WEB_DAST_SESSION={cookie_value}\n")
          PY

      - name: Run authenticated OWASP ZAP browser scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network narrowcti-web-ui-dast \
            --env ZAP_AUTH_HEADER=Cookie \
            --env ZAP_AUTH_HEADER_VALUE="${NARROWCTI_WEB_DAST_COOKIE}" \
            --env ZAP_AUTH_HEADER_SITE=narrowcti-web-ui-dast \
            --volume "${NARROWCTI_WEB_DAST_ROOT}/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py \
            -t http://narrowcti-web-ui-dast:8081/explorer \
            -I \
            -m 5 \
            -J narrowcti-web-ui-zap.json \
            -r narrowcti-web-ui-zap.html \
            -w narrowcti-web-ui-zap.md \
            -T 10

      - name: Upload authenticated UI DAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: narrowcti-web-ui-dast-${{ github.sha }}
          path: ${{ env.NARROWCTI_WEB_DAST_ROOT }}/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up disposable Web deployment
        if: always()
        shell: bash
        run: |
          docker rm --force narrowcti-web-ui-dast >/dev/null 2>&1 || true
          docker network rm narrowcti-web-ui-dast >/dev/null 2>&1 || true
